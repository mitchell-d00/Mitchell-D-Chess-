<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free chess in your browser: 35 computer levels, chess clocks, official FIDE rules mode, a 38-lesson tutorial, and custom colours. Works offline.">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<title>Mitchell D Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: the board is the page. A side rail holds the match card, status, moves and controls; Learn swaps the rail for a lesson card. Palette: club-room stone and tournament-felt green. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
  --bg:#e8eae5; --panel:#f6f7f3; --ink:#1b211e; --muted:#59645f; --line:#cdd3ce; --well:#dde1dc;
  --accent:#2d6a52; --accent-ink:#ffffff; --good:#2d7a4f; --bad:#b4432c; --warn:#a86a12;
  --shadow:0 1px 0 rgba(27,33,30,.05),0 14px 34px -18px rgba(27,33,30,.45);
  --display:"Spectral SC",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* board + pieces (overwritten from settings) */
  --sq-light:#eeeed2; --sq-dark:#769656;
  --pw:#fbfaf5; --pw-line:#1d1d1d; --pb:#262321; --pb-line:#f0ede6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --panel:#181d1a; --ink:#e3e8e4; --muted:#93a09a; --line:#2b3430; --well:#0b0e0c;
    --accent:#6dbb98; --accent-ink:#0b1510; --good:#6cc08e; --bad:#e27a62; --warn:#e0a84a;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --panel:#181d1a; --ink:#e3e8e4; --muted:#93a09a; --line:#2b3430; --well:#0b0e0c;
  --accent:#6dbb98; --accent-ink:#0b1510; --good:#6cc08e; --bad:#e27a62; --warn:#e0a84a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.9); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:15.5px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.5rem .8rem;font-weight:700;line-height:1.15}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:.32rem .6rem;font-size:.86rem}
.btn.icon{padding:.42rem .55rem;min-width:2.4rem}
select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.45rem .6rem;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 36px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand h1{font-size:1.45rem;letter-spacing:.02em}
.tabs{display:inline-flex;background:var(--well);border-radius:11px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:.42rem .95rem;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.top .right{margin-left:auto;display:flex;gap:6px;align-items:center}

.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.boardcol{display:grid;gap:8px;justify-items:center;min-width:0}
.playerbar{width:100%;max-width:var(--bsize);display:flex;align-items:center;gap:10px;min-height:32px;font-size:.92rem}
.playerbar .who{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.playerbar .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playerbar .lvl{font-size:.78rem;color:var(--muted);font-weight:400}
.playerbar .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.playerbar .caps{margin-left:auto;display:flex;align-items:center;gap:1px;flex-wrap:wrap;justify-content:flex-end}
.playerbar .caps svg{width:20px;height:20px;margin-left:-5px}
.playerbar .caps b{font-size:.8rem;margin-left:6px;font-variant-numeric:tabular-nums;color:var(--muted)}
.playerbar.turn .who::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.thinking{font-size:.78rem;color:var(--accent);font-weight:700;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}

/* Board */
:root{--bsize:min(640px,calc(100vw - 32px),calc(100vh - 190px))}
@media (max-width:980px){:root{--bsize:min(640px,calc(100vw - 32px))}}
.boardwrap{position:relative;width:var(--bsize);max-width:100%;aspect-ratio:1;border-radius:6px;box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none}
.board{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:6px;overflow:hidden}
.sq{position:relative;background:var(--sq-light)}
.sq.d{background:var(--sq-dark)}
.sq .co{position:absolute;font-size:clamp(8px,1.6vw,12px);font-weight:700;font-family:var(--body);line-height:1;pointer-events:none}
.sq .co.f{right:4%;bottom:4%}
.sq .co.r{left:5%;top:5%}
.sq.l .co{color:var(--sq-dark)} .sq.d .co{color:var(--sq-light)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,214,51,.42)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,214,51,.6)}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(230,40,30,.9) 0%,rgba(230,40,30,.55) 35%,rgba(230,40,30,0) 72%)}
.sq.mark::before{content:"";position:absolute;inset:6%;border:3px solid rgba(45,140,255,.75);border-radius:8%}
.sq.hov{box-shadow:inset 0 0 0 4px rgba(255,255,255,.7)}
.sq .dot{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(20,30,25,.28);pointer-events:none;z-index:1}
.sq .ring{position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(20,30,25,.28);pointer-events:none;z-index:1}
.pieces{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;will-change:transform;transition:transform var(--anim,160ms) ease}
.pc svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.28))}
.pc.drag{transition:none;z-index:5}
.pc.drag svg{transform:scale(1.12)}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:4}
.promo{position:absolute;z-index:8;display:grid;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;width:12.5%}
.promo button{border:0;background:transparent;aspect-ratio:1;padding:6%}
.promo button:hover{background:var(--well)}
.boardmsg{position:absolute;inset:0;display:grid;place-items:center;z-index:9;pointer-events:none}
.boardmsg div{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px 22px;text-align:center;display:grid;gap:10px;justify-items:center;max-width:80%}
.boardmsg h2{font-size:1.6rem}

/* Rail */
.rail{display:grid;gap:12px;min-width:0}
.card{padding:14px;display:grid;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--well);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:.45rem .4rem;font-weight:700;font-size:.85rem;color:var(--muted);line-height:1.15}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:grid;gap:5px}
.field>label,.field>.lab{font-size:.8rem;font-weight:700;color:var(--muted)}
.lvlrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.lvlnum{font-family:var(--display);font-size:1.7rem;font-weight:700;width:2.4ch;text-align:center;line-height:1}
input[type=range]{width:100%;accent-color:var(--accent)}
.lvlname{font-weight:700}
.lvlabout{font-size:.82rem;color:var(--muted)}
.tierpill{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.08rem .45rem;border-radius:99px;background:var(--well);color:var(--ink);margin-left:6px;vertical-align:1px}
.ladder{display:grid;grid-template-columns:repeat(35,1fr);gap:2px;margin-top:4px}
.ladder i{height:6px;border-radius:2px;background:var(--line)}
.ladder i.on{background:var(--accent)}
.status{display:flex;align-items:center;gap:10px;font-weight:700}
.status .ic{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--line)}
.status.check{color:var(--bad)}
.evalbar{height:8px;border-radius:99px;background:var(--pb);overflow:hidden;border:1px solid var(--line)}
.evalbar i{display:block;height:100%;background:var(--pw);transition:width .4s}
.evaltxt{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between}
.moves{max-height:260px;overflow:auto;font-family:var(--mono);font-size:.86rem;display:grid;grid-template-columns:2.6em 1fr 1fr;align-content:start;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.moves .n{color:var(--muted);padding:.2rem .4rem;text-align:right;font-variant-numeric:tabular-nums}
.moves button{border:0;background:transparent;text-align:left;padding:.2rem .45rem;border-radius:5px;font-family:var(--mono);font-size:.86rem}
.moves button:hover{background:var(--well)}
.moves button.cur{background:var(--accent);color:var(--accent-ink)}
.moves .empty{grid-column:1/-1;padding:.6rem;color:var(--muted);font-family:var(--body);font-size:.86rem}
.navrow{display:flex;gap:6px;flex-wrap:wrap}
.navrow .grow{flex:1}
.ctlgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tcgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tcgrid label{display:grid;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.4rem .55rem;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.rulesnote{font-size:.8rem;color:var(--muted)}
.clock{margin-left:8px;flex:none;font-family:var(--mono);font-size:1.08rem;font-weight:600;padding:.18rem .6rem;border-radius:8px;background:var(--well);color:var(--ink);min-width:4.9em;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--line)}
.clock.run{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.clock.low{color:var(--bad)}
.clock.run.low{background:var(--bad);color:#fff;border-color:var(--bad)}
.clock.out{background:var(--bad);color:#fff;border-color:var(--bad)}
.drawbox{display:grid;gap:8px;padding:.6rem .7rem;border-radius:10px;background:var(--well);font-size:.9rem}
.drawbox .row{display:flex;gap:6px;flex-wrap:wrap}
.official-tag{display:inline-block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.08rem .45rem;border-radius:99px;background:var(--accent);color:var(--accent-ink);margin-left:6px;vertical-align:2px}

/* Learn */
.lesson{padding:16px;display:grid;gap:10px}
.lesson h2{font-size:1.45rem}
.lesson .txt{font-size:.98rem}
.lesson .task{padding:.7rem .8rem;border-radius:10px;background:var(--well);font-weight:700;display:flex;gap:8px;align-items:flex-start}
.feedback{padding:.65rem .8rem;border-radius:10px;font-weight:700;font-size:.93rem}
.feedback.good{background:color-mix(in srgb,var(--good) 16%,var(--panel));color:var(--good)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
.feedback.info{background:var(--well);color:var(--ink);font-weight:400}
.progress{height:6px;border-radius:99px;background:var(--well);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.lessonlist{display:grid;gap:12px;max-height:440px;overflow:auto;padding-right:2px}
.tiergroup{display:grid;gap:3px}
.tiergroup h3{font-size:.95rem;display:flex;justify-content:space-between;align-items:baseline}
.tiergroup h3 span{font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:400}
.litem{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:.32rem .45rem;border-radius:8px;font-size:.9rem}
.litem:hover{background:var(--well)}
.litem.cur{background:var(--well);font-weight:700}
.litem .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--accent-ink)}
.litem.done .tick{background:var(--good);border-color:var(--good)}
.kind{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Modal */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 40%,rgba(0,0,0,.55))}
.modal{width:min(620px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:grid;gap:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.setsec{display:grid;gap:10px}
.setsec h3{font-size:1.05rem}
.setrow{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.setrow .lab b{display:block;font-size:.93rem}
.setrow .lab span{font-size:.8rem;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.swatch{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px;display:grid;gap:5px;justify-items:center;font-size:.74rem;font-weight:700}
.swatch.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mini{width:52px;height:52px;display:grid;grid-template:repeat(2,1fr)/repeat(2,1fr);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.pcpair{display:flex;gap:2px;width:52px;height:30px;justify-content:center}
.pcpair svg{width:26px;height:30px}
.pickers{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.pickers label{display:flex;gap:6px;align-items:center}
input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
.sw-mini{display:inline-flex;gap:0;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--panel);padding:.6rem 1rem;border-radius:10px;font-weight:700;max-width:calc(100vw - 32px)}
textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:.82rem;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink)}

@media (max-width:980px){
  .game{grid-template-columns:minmax(0,1fr)}
  .rail{max-width:680px;width:100%;margin:0 auto}
}
html[data-motion="off"] .pc{transition:none}
@media (prefers-reduced-motion:reduce){.thinking{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 45 45" aria-hidden="true"><rect width="45" height="45" rx="10" fill="var(--accent)"/><path d="M14 35h18c.3-6.5-1.6-11.5-3.6-15.5 1.6-2.6 1-6-1.8-7.8l-.8-3.2-2.2 2.6c-5.2.8-9.4 4.7-11.1 10.2l-.9 3.2c-.4 1.9 1.6 3 3 1.7l2-1.8c1.6.1 3-.5 3.9-1.6.2 4.4-6.8 6.3-6.5 12.2z" fill="var(--accent-ink)"/><circle cx="18.2" cy="15.6" r="1.2" fill="var(--accent)"/></svg>
      <h1>Mitchell D Chess</h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="on" data-tab="play" role="tab" aria-selected="true">Play</button>
      <button data-tab="learn" role="tab" aria-selected="false">Learn</button>
    </div>
    <div class="right">
      <button class="btn small" id="themeBtn" aria-label="Switch light or dark mode"></button>
      <button class="btn small" id="setBtn">Colours &amp; settings</button>
    </div>
  </header>

  <main class="game">
    <div class="boardcol">
      <div class="playerbar" id="barTop"></div>
      <div class="boardwrap" id="boardwrap">
        <div class="board" id="board"></div>
        <div class="pieces" id="pieces"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 800 800" preserveAspectRatio="none"></svg>
        <div class="boardmsg" id="boardmsg" hidden></div>
      </div>
      <div class="playerbar" id="barBot"></div>
    </div>

    <aside class="rail" id="railPlay">
      <div class="card panel">
        <div class="seg" id="modeSeg">
          <button data-mode="pvc" class="on">You vs computer</button>
          <button data-mode="pvp">Two players</button>
          <button data-mode="cvc">Computer vs computer</button>
        </div>
        <div id="setupPvc" class="field" style="gap:10px">
          <div class="field"><span class="lab">Play as</span>
            <div class="seg" id="colorSeg"><button data-c="w" class="on">White</button><button data-c="b">Black</button><button data-c="r">Random</button></div>
          </div>
          <div class="field"><label for="lvl">Computer level</label>
            <div class="lvlrow"><span class="lvlnum" id="lvlNum">8</span><input type="range" id="lvl" min="1" max="35" value="8"></div>
            <div><span class="lvlname" id="lvlName"></span><span class="tierpill" id="lvlTier"></span></div>
            <div class="lvlabout" id="lvlAbout"></div>
            <div class="ladder" id="ladder" aria-hidden="true"></div>
          </div>
        </div>
        <div id="setupCvc" class="field" hidden style="gap:10px">
          <div class="field"><label for="lvlW">White computer</label><select id="lvlW"></select></div>
          <div class="field"><label for="lvlB">Black computer</label><select id="lvlB"></select></div>
          <div class="field"><span class="lab">Move speed</span><div class="seg" id="speedSeg"><button data-sp="slow">Slow</button><button data-sp="normal" class="on">Normal</button><button data-sp="fast">Fast</button></div></div>
        </div>
        <div class="field"><label for="tcSel">Clock</label>
          <select id="tcSel">
            <option value="none">No clock</option>
            <optgroup label="Bullet"><option value="1+0">1 min</option><option value="1+1">1 min + 1 sec</option><option value="2+1">2 min + 1 sec</option></optgroup>
            <optgroup label="Blitz"><option value="3+0">3 min</option><option value="3+2">3 min + 2 sec</option><option value="5+0">5 min</option><option value="5+3">5 min + 3 sec</option></optgroup>
            <optgroup label="Rapid"><option value="10+0">10 min</option><option value="10+5">10 min + 5 sec</option><option value="15+10">15 min + 10 sec</option><option value="25+10">25 min + 10 sec</option></optgroup>
            <optgroup label="Classical"><option value="30+0">30 min</option><option value="30+20">30 min + 20 sec</option><option value="60+30">60 min + 30 sec</option><option value="90+30">90 min + 30 sec</option></optgroup>
            <optgroup label="Per move"><option value="m10">10 sec per move</option><option value="m30">30 sec per move</option><option value="m60">1 min per move</option></optgroup>
            <option value="custom">Custom…</option>
          </select>
        </div>
        <div class="tcgrid" id="tcCustom" hidden>
          <label for="tcWm">White minutes <input type="number" id="tcWm" min="0.25" max="600" step="0.25" value="10"></label>
          <label for="tcBm">Black minutes <input type="number" id="tcBm" min="0.25" max="600" step="0.25" value="10"></label>

    LS.busy = true; renderLearnBars(); renderLearn();
    const tok = LS.token;
    think(l.fen, LS.moves.slice(), l.level).then(r => {
      setTimeout(() => {
        if (LS.token !== tok) return;
        LS.busy = false;
        if (!r || !r.move) return;
        lessonApply(r.move);
        learnBoard();
        const st2 = LS.chess.status();
        if (st2) { if (st2.reason === 'checkmate') lessonFail('You were checkmated.'); else lessonFail(`The game ended in a draw by ${st2.reason}.`); return; }
        if (l.goal === 'promote' && LS.chess.legalMoves().length && !hasPawn(LS.human)) { lessonFail('Your pawn was captured.'); return; }
        renderLearn();
      }, 300);
    });
  }
}
function hasPawn(side) { return parseFenBoard(LS.chess.fen()).some(p => p.type === 'p' && p.color === side); }
function lessonWin() { const l = LESSONS[LS.idx]; LS.state = 'solved'; LS.feedback = { cls: 'good', text: l.done || 'Well done!' }; LS.done.add(LS.idx); saveDone(); Snd.end(); renderLearn(); learnBoard(); }
function lessonFail(t) { LS.state = 'failed'; LS.feedback = { cls: 'bad', text: t + ' Press Try again to restart.' }; renderLearn(); learnBoard(); }
const KIND = { info: 'Read', move: 'Find the move', check: 'Give check', mate: 'Mate in one', play: 'Play it out' };
function renderLearn() {
  const l = LESSONS[LS.idx], n = LESSONS.length;
  const last = LS.idx === n - 1;
  let fb = '';
  if (LS.feedback) fb = `<div class="feedback ${LS.feedback.cls}">${LS.feedback.text}</div>`;
  else if (LS.showHint && l.hint) fb = `<div class="feedback info">Hint: ${esc(l.hint)}</div>`;
  const solved = LS.state === 'solved' || l.type === 'info';
  $('#lessonCard').innerHTML = `
    <div><p class="eyebrow">${esc(l.tier)} · Lesson ${LS.idx + 1} of ${n} · ${KIND[l.type]}</p><h2>${esc(l.title)}</h2></div>
    <p class="txt">${l.text}</p>
    ${l.task ? `<div class="task"><span aria-hidden="true">♟</span><span>${esc(l.task)}</span></div>` : ''}
    ${fb}
    <div class="navrow">
      <button class="btn small" id="lPrev" ${LS.idx === 0 ? 'disabled' : ''}>Previous</button>
      ${l.type !== 'info' ? `<button class="btn small" id="lHint" ${solved ? 'disabled' : ''}>Hint</button><button class="btn small" id="lReset">${LS.state === 'failed' ? 'Try again' : 'Reset'}</button>` : ''}
      <span class="grow"></span>
      <button class="btn small ${solved ? 'primary' : ''}" id="lNext" ${last ? 'disabled' : ''}>${solved ? 'Next lesson' : 'Skip'}</button>
    </div>`;
  $('#lPrev').onclick = () => loadLesson(LS.idx - 1);
  $('#lNext').onclick = () => { if (l.type === 'info') { LS.done.add(LS.idx); saveDone(); } LS.showHint = false; loadLesson(LS.idx + 1); };
  if ($('#lHint')) $('#lHint').onclick = () => {
    LS.showHint = true; LS.feedback = null;
    if (l.type === 'move' && l.accept) BV.arrows = [[l.accept[0].slice(0, 2), l.accept[0].slice(2, 4)]];
    renderLearn(); renderBoard();
  };
  if ($('#lReset')) $('#lReset').onclick = () => { LS.showHint = false; loadLesson(LS.idx); };
  // list
  const tiers = [...new Set(LESSONS.map(x => x.tier))];
  $('#lessonList').innerHTML = tiers.map(t => {
    const items = LESSONS.map((x, i) => ({ x, i })).filter(o => o.x.tier === t);
    const d = items.filter(o => LS.done.has(o.i)).length;
    return `<div class="tiergroup"><h3>${esc(t)} <span>${d}/${items.length}</span></h3>${items.map(o => `<button class="litem ${LS.done.has(o.i) ? 'done' : ''} ${o.i === LS.idx ? 'cur' : ''}" data-l="${o.i}"><span class="tick">${LS.done.has(o.i) ? '✓' : ''}</span><span>${esc(o.x.title)} <span class="kind">· ${KIND[o.x.type]}</span></span></button>`).join('')}</div>`;
  }).join('');
  $('#learnProg').textContent = `${LS.done.size} of ${n} complete`;
  $('#learnBar').style.width = (LS.done.size / n * 100) + '%';
}
$('#lessonList').addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (b) { LS.showHint = false; loadLesson(+b.dataset.l); } });

// ================= Tabs =================
let tab = 'play';
function setTab(t) {
  if (t === tab) return;
  tab = t;
  $$('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
  $('#railPlay').hidden = t !== 'play'; $('#railLearn').hidden = t !== 'learn';
  $('#boardmsg').hidden = true;
  if (t === 'learn') {
    if (G) { G.paused = G.mode === 'cvc' ? true : G.paused; G.token = Math.random(); G.thinking = false; cancelThinking(); G.tabPaused = true; }
    loadLesson(LS.idx);
  } else {
    LS.token = Math.random(); cancelThinking(); if (G) { G.thinking = false; G.tabPaused = false; if (G.clock) G.clock.last = performance.now(); }
    BV.flipped = G.mode === 'pvc' ? G.players.b.type === 'human' : false;
    BV.marks = []; BV.arrows = [];
    afterChange();
    if (G.over) $('#boardmsg').hidden = true;
  }
}
$$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

// ================= Settings modal =================
function openModal(html, after) {
  $('#ovBox').innerHTML = html; $('#ov').hidden = false;
  $('#ovBox').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
  if (after) after(); else $('#ovBox button')?.focus();
}
function closeModal() { $('#ov').hidden = true; $('#ovBox').innerHTML = ''; }
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#ov').hidden) closeModal(); else if ($('.promo')) { if (!(BV.lock && BV.lock())) $('.promo').remove(); } else if (BV.sel && !(BV.lock && BV.lock())) { BV.sel = null; BV.targets = []; renderBoard(); } }
  if (e.target.matches('input,select,textarea') || !$('#ov').hidden) return;
  if (tab === 'play' && G) { if (e.key === 'ArrowLeft') { $('#navPrev').click(); e.preventDefault(); } if (e.key === 'ArrowRight') { $('#navNext').click(); e.preventDefault(); } }
});
function seg(key, opts) { return `<div class="seg" data-set="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(S[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`; }
function openSettings() {
  const bt = BOARD_THEMES.map(([n, a, b]) => `<button class="swatch ${S.light === a && S.dark === b ? 'on' : ''}" data-board="${a},${b}"><span class="mini"><i style="background:${a}"></i><i style="background:${b}"></i><i style="background:${b}"></i><i style="background:${a}"></i></span>${n}</button>`).join('');
  const pt = PIECE_THEMES.map(([n, a, b]) => `<button class="swatch ${S.pw === a && S.pb === b ? 'on' : ''}" data-pieces="${a},${b}"><span class="pcpair" style="--pw:${a};--pb:${b};--pw-line:${lum(a) > .35 ? '#1c1c1c' : '#f3f1ec'};--pb-line:${lum(b) > .35 ? '#1c1c1c' : '#f3f1ec'};background:linear-gradient(90deg,${S.light} 50%,${S.dark} 50%);border-radius:5px">${pieceSVG('n', 'w')}${pieceSVG('n', 'b')}</span>${n}</button>`).join('');
  openModal(`<div class="modal-head"><h2 style="font-size:1.4rem">Colours &amp; settings</h2><button class="btn small" data-close>Done</button></div>
  <div class="setsec"><h3>Appearance</h3>
    <div class="setrow"><div class="lab"><b>Theme</b><span>Light, dark, or follow your device</span></div>${seg('theme', [['system', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}</div>
  </div>
  <div class="setsec"><h3>Board colours</h3>
    <div class="swatches" id="boardSw">${bt}</div>
    <div class="pickers"><label>Light squares <input type="color" id="pkLight" value="${S.light}"></label><label>Dark squares <input type="color" id="pkDark" value="${S.dark}"></label></div>
  </div>
  <div class="setsec"><h3>Piece colours</h3>
    <div class="swatches" id="pieceSw">${pt}</div>
    <div class="pickers"><label>White side <input type="color" id="pkW" value="${S.pw}"></label><label>Black side <input type="color" id="pkB" value="${S.pb}"></label></div>
  </div>
  <div class="setsec"><h3>Board</h3>
    <div class="setrow"><div class="lab"><b>Coordinates</b><span>Letters and numbers on the edge</span></div>${seg('coords', [[true, 'On'], [false, 'Off']])}</div>
    <div class="setrow"><div class="lab"><b>Show legal moves</b><span>Dots where the selected piece can go</span></div>${seg('legal', [[true, 'On'], [false, 'Off']])}</div>
    <div class="setrow"><div class="lab"><b>Highlight last move</b></div>${seg('lastmove', [[true, 'On'], [false, 'Off']])}</div>
    <div class="setrow"><div class="lab"><b>Piece animation</b></div>${seg('anim', [['off', 'Off'], ['fast', 'Fast'], ['normal', 'Smooth']])}</div>
    <div class="setrow"><div class="lab"><b>Always promote to queen</b><span>Skip the promotion picker</span></div>${seg('autoQueen', [[false, 'Off'], [true, 'On']])}</div>
    <div class="setrow"><div class="lab"><b>Sounds</b></div>${seg('sound', [[true, 'On'], [false, 'Off']])}</div>
  </div>`);
  const box = $('#ovBox');
  const refresh = () => { applySettings(); renderBoard(); if (tab === 'play') renderBars(); else renderLearnBars(); };
  box.onclick = e => {
    const sb = e.target.closest('.seg[data-set] button');
    if (sb) { const k = sb.parentElement.dataset.set; let v = sb.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; S[k] = v; saveS(); $$('button', sb.parentElement).forEach(x => x.classList.toggle('on', x === sb)); refresh(); return; }
    const b1 = e.target.closest('[data-board]');
    if (b1) { [S.light, S.dark] = b1.dataset.board.split(','); saveS(); $$('#boardSw .swatch').forEach(x => x.classList.toggle('on', x === b1)); $('#pkLight').value = S.light; $('#pkDark').value = S.dark; refresh(); return; }
    const b2 = e.target.closest('[data-pieces]');
    if (b2) { [S.pw, S.pb] = b2.dataset.pieces.split(','); saveS(); $$('#pieceSw .swatch').forEach(x => x.classList.toggle('on', x === b2)); $('#pkW').value = S.pw; $('#pkB').value = S.pb; refresh(); return; }
  };
  $('#pkLight').oninput = e => { S.light = e.target.value; saveS(); $$('#boardSw .swatch').forEach(x => x.classList.remove('on')); refresh(); };
  $('#pkDark').oninput = e => { S.dark = e.target.value; saveS(); $$('#boardSw .swatch').forEach(x => x.classList.remove('on')); refresh(); };
  $('#pkW').oninput = e => { S.pw = e.target.value; saveS(); $$('#pieceSw .swatch').forEach(x => x.classList.remove('on')); refresh(); };
  $('#pkB').oninput = e => { S.pb = e.target.value; saveS(); $$('#pieceSw .swatch').forEach(x => x.classList.remove('on')); refresh(); };
}
$('#setBtn').onclick = openSettings;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

// ================= Boot =================
applySettings();
LS.idx = Math.min(LESSONS.length - 1, store.get('lessonIdx', 0) || 0);
syncPlay();
newGame();
</script>

</body>
